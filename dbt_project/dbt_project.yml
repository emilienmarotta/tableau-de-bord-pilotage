name: 'tableau_de_bord_pilotage'
version: '1.0.0'
config-version: 2

profile: 'tableau_de_bord_pilotage'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Seuils de statut de stock (spec 01), centralisés ici pour ne pas être
  # dupliqués en dur dans mart_stock_sante.
  stock_couverture_reappro_jours: 7
  stock_couverture_surstock_jours: 90

models:
  tableau_de_bord_pilotage:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
